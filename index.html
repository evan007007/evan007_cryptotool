<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>文本加密工具 · 严格校验版</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-light: #eff6ff;
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --warning-bg: #fefce8;
            --warning-border: #fef08a;
            --warning-text: #854d0e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 20px 10px; }
        .container { width: 100%; max-width: 480px; background: #ffffff; border-radius: 20px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); height: fit-content; }
        
        .header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .header svg { width: 28px; height: 28px; fill: var(--primary-color); }
        .header h1 { font-size: 22px; font-weight: 600; }

        .alert { background-color: var(--warning-bg); border: 1px solid var(--warning-border); color: var(--warning-text); padding: 14px; border-radius: 10px; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }

        .tabs { display: flex; background: #f1f5f9; border-radius: 12px; padding: 4px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px 0; border: none; background: transparent; font-size: 15px; font-weight: 500; color: var(--text-muted); border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background: var(--primary-color); color: white; box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2); }

        .card { background: #ffffff; border-radius: 12px; margin-bottom: 16px; }
        .card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--text-main); }
        
        #mode-section { display: block; }
        .mode-grid { display: flex; gap: 12px; }
        .mode-item { flex: 1; border: 1.5px solid var(--border-color); border-radius: 10px; padding: 12px; cursor: pointer; transition: all 0.2s; position: relative; }
        .mode-item.active { border-color: var(--primary-color); background-color: var(--primary-light); }
        .mode-item .title { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--text-main); margin-bottom: 4px; }
        .mode-item.active .title { color: var(--primary-color); }
        .mode-item .desc { font-size: 12px; color: var(--text-muted); }

        .textarea-wrapper { border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; transition: border-color 0.2s; }
        .textarea-wrapper:focus-within { border-color: var(--primary-color); }
        textarea { width: 100%; height: 140px; border: none; outline: none; resize: none; font-size: 15px; line-height: 1.5; color: var(--text-main); background: transparent; word-break: break-all; }
        textarea::placeholder { color: #94a3b8; }
        .copy-btn { display: block; text-align: right; font-size: 14px; color: var(--text-muted); cursor: pointer; margin-top: 8px; background: none; border: none; padding: 0; margin-left: auto; }
        .copy-btn:hover { color: var(--primary-color); }

        .input-wrapper { display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: 10px; padding: 0 12px; height: 48px; transition: border-color 0.2s; }
        .input-wrapper:focus-within { border-color: var(--primary-color); }
        .input-wrapper input { flex: 1; border: none; outline: none; font-size: 15px; color: var(--text-main); background: transparent; }
        .input-wrapper input::placeholder { color: #94a3b8; }
        .eye-icon { cursor: pointer; fill: #94a3b8; width: 20px; height: 20px; }
        .eye-icon:hover { fill: var(--text-muted); }

        .action-btn { width: 100%; height: 52px; background: var(--primary-color); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .action-btn:hover { background: #1d4ed8; }
        .action-btn:active { transform: scale(0.98); }
        .hidden { display: none !important; }

        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.85); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; text-align: center; white-space: nowrap; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
            <h1>文本加密工具</h1>
        </div>

        <div class="alert">
            🔐 严格校验版：使用 <strong>SHA-256 密钥流 + HMAC 校验</strong><br>
            密码错一位即解密失败，密文必须使用<strong>完全相同</strong>的密码才能解开。
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('encrypt')" id="tab-encrypt">加密</button>
            <button class="tab-btn" onclick="switchTab('decrypt')" id="tab-decrypt">解密</button>
        </div>

        <div class="card" id="mode-section">
            <div class="card-title">加密模式</div>
            <div class="mode-grid">
                <div class="mode-item active" onclick="selectMode('simple')" id="mode-simple">
                    <div class="title">简洁模式</div>
                    <div class="desc">短密文，严格校验</div>
                </div>
                <div class="mode-item" onclick="selectMode('standard')" id="mode-standard">
                    <div class="title">标准模式</div>
                    <div class="desc">长密文，极高安全</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title" id="input-title">需要加密的文本</div>
            <div class="textarea-wrapper">
                <textarea id="input-text" placeholder="在此处输入要加密的文本内容"></textarea>
                <button class="copy-btn" onclick="copyText('input-text')">复制</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">密码</div>
            <div class="input-wrapper">
                <input type="password" id="password" placeholder="请输入密码">
                <svg class="eye-icon" id="eye-icon" onclick="togglePassword()" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </div>
        </div>

        <button class="action-btn" id="action-btn" onclick="handleAction()">开始加密</button>
    </div>

    <div id="toast">提示信息</div>

    <script>
        let currentTab = 'encrypt';
        let currentMode = 'simple';

        // ================= UI 交互 =================
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-encrypt').classList.toggle('active', tab === 'encrypt');
            document.getElementById('tab-decrypt').classList.toggle('active', tab === 'decrypt');
            
            const modeSection = document.getElementById('mode-section');
            const inputTitle = document.getElementById('input-title');
            const inputText = document.getElementById('input-text');
            const actionBtn = document.getElementById('action-btn');

            if (tab === 'encrypt') {
                modeSection.classList.remove('hidden');
                inputTitle.innerText = '需要加密的文本';
                inputText.placeholder = '在此处输入要加密的文本内容';
                actionBtn.innerText = '开始加密';
            } else {
                modeSection.classList.add('hidden');
                inputTitle.innerText = '需要解密的文本';
                inputText.placeholder = '在此处粘贴密文，系统会自动识别';
                actionBtn.innerText = '开始解密';
            }
            inputText.value = '';
        }

        function selectMode(mode) {
            currentMode = mode;
            document.getElementById('mode-simple').classList.toggle('active', mode === 'simple');
            document.getElementById('mode-standard').classList.toggle('active', mode === 'standard');
        }

        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.style.fill = '#2563eb';
            } else {
                pwdInput.type = 'password';
                eyeIcon.style.fill = '#94a3b8';
            }
        }

        function copyText(id) {
            const textarea = document.getElementById(id);
            if (!textarea.value) return showToast('没有可复制的内容');
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('复制成功');
            } catch (err) {
                showToast('复制失败，请手动复制');
            }
            window.getSelection().removeAllRanges();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2500);
        }

        // ================= 编码工具 =================
        function strToBytes(str) { return new TextEncoder().encode(str); }
        function bytesToStr(bytes) { return new TextDecoder().decode(bytes); }

        function bytesToStandardBase64(bytes) {
            let binary = '';
            for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
            return btoa(binary);
        }
        function standardBase64ToBytes(str) {
            const binary = atob(str);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        // URL-safe Base64，无填充（去掉 =），用于简洁模式
        function bytesToCleanBase64(bytes) {
            return bytesToStandardBase64(bytes).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
        }
        function cleanBase64ToBytes(str) {
            let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
            while (b64.length % 4 !== 0) b64 += '=';
            return standardBase64ToBytes(b64);
        }

        // ================= 字符集混淆置换（用于标准模式） =================
        // 一个固定的 64 字符随机排列，用于打乱标准 Base64 的字符分布
        const SHUFFLE_KEY = "q7YpL2mXvR9tKcNzBwA5sEfHdGjUoI1lP0aQ6rT8yW3uV4xS5zC6bN7M8kO9J0hF1gD2eR3wQ4aZ5xS6cV7bN8mK9lJ0hG1fD2sA3pO4iU5yT6rE7wQ8aZ9xS0cV1bN2mK3lJ4hG5fD6sA7pO8iU9yT0rE1wQ2aZ3xS4cV5bN6mK7lJ8hG9fD0sA1pO2iU3yT4rE5wQ6aZ7xS8cV9bN0mK1lJ2hG3fD4sA5pO6iU7yT8rE9wQ0";
        // 构建置换表：base64 字符集 -> 混淆字符
        const B64_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
        let SHUFFLE_MAP = {};
        let UNSHUFFLE_MAP = {};
        (function buildShuffleMaps() {
            // 用固定字符串生成一个 64 长度的排列（通过去重保证唯一性）
            const seen = new Set();
            let seq = "";
            for (const ch of SHUFFLE_KEY) {
                if (!seen.has(ch) && B64_ALPHABET.includes(ch)) {
                    seen.add(ch);
                    seq += ch;
                }
                if (seq.length === 64) break;
            }
            // 如果不够 64，用字母表补齐
            for (const ch of B64_ALPHABET) {
                if (seq.length === 64) break;
                if (!seen.has(ch)) { seen.add(ch); seq += ch; }
            }
            for (let i = 0; i < 64; i++) {
                SHUFFLE_MAP[B64_ALPHABET[i]] = seq[i];
                UNSHUFFLE_MAP[seq[i]] = B64_ALPHABET[i];
            }
        })();

        function shuffleBase64(str) {
            let out = '';
            for (const ch of str) out += SHUFFLE_MAP[ch] || ch;
            return out;
        }
        function unshuffleBase64(str) {
            let out = '';
            for (const ch of str) out += UNSHUFFLE_MAP[ch] || ch;
            return out;
        }

        // ================= 纯 JS SHA-256 =================
        const SHA256_K = new Uint32Array([
            0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
            0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
            0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
            0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
            0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
            0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
            0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
            0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
        ]);

        function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }

        function sha256Sync(bytes) {
            const len = bytes.length;
            const bitLenHi = Math.floor((len * 8) / 0x100000000);
            const bitLenLo = (len * 8) >>> 0;

            const paddedLen = Math.ceil((len + 9) / 64) * 64;
            const padded = new Uint8Array(paddedLen);
            padded.set(bytes, 0);
            padded[len] = 0x80;
            const dv = new DataView(padded.buffer);
            dv.setUint32(paddedLen - 8, bitLenHi, false);
            dv.setUint32(paddedLen - 4, bitLenLo, false);

            let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
            let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;

            const w = new Uint32Array(64);

            for (let offset = 0; offset < paddedLen; offset += 64) {
                for (let i = 0; i < 16; i++) {
                    w[i] = dv.getUint32(offset + i * 4, false);
                }
                for (let i = 16; i < 64; i++) {
                    const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
                    const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
                    w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
                }

                let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;

                for (let i = 0; i < 64; i++) {
                    const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
                    const ch = (e & f) ^ (~e & g);
                    const temp1 = (h + S1 + ch + SHA256_K[i] + w[i]) >>> 0;
                    const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
                    const maj = (a & b) ^ (a & c) ^ (b & c);
                    const temp2 = (S0 + maj) >>> 0;

                    h = g; g = f; f = e; e = (d + temp1) >>> 0;
                    d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
                }

                h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
                h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + h) >>> 0;
            }

            const out = new Uint8Array(32);
            const outDv = new DataView(out.buffer);
            outDv.setUint32(0, h0, false);
            outDv.setUint32(4, h1, false);
            outDv.setUint32(8, h2, false);
            outDv.setUint32(12, h3, false);
            outDv.setUint32(16, h4, false);
            outDv.setUint32(20, h5, false);
            outDv.setUint32(24, h6, false);
            outDv.setUint32(28, h7, false);
            return out;
        }

        // ================= 密码学原语 =================
        function deriveKey(passwordBytes, saltBytes) {
            let material = new Uint8Array(passwordBytes.length + saltBytes.length + 1);
            material.set(passwordBytes, 0);
            material.set(saltBytes, passwordBytes.length);
            material[passwordBytes.length + saltBytes.length] = 0x01;

            let h = sha256Sync(material);
            for (let i = 0; i < 2; i++) {
                const next = new Uint8Array(h.length + 1);
                next.set(h, 0);
                next[h.length] = i + 2;
                h = sha256Sync(next);
            }
            return h;
        }

        function deriveKeystream(keyBytes, len) {
            const stream = new Uint8Array(len);
            let offset = 0;
            let counter = 0;
            while (offset < len) {
                const blockInput = new Uint8Array(keyBytes.length + 4);
                blockInput.set(keyBytes, 0);
                blockInput[keyBytes.length] = (counter >>> 24) & 0xFF;
                blockInput[keyBytes.length + 1] = (counter >>> 16) & 0xFF;
                blockInput[keyBytes.length + 2] = (counter >>> 8) & 0xFF;
                blockInput[keyBytes.length + 3] = counter & 0xFF;
                const block = sha256Sync(blockInput);
                const take = Math.min(block.length, len - offset);
                stream.set(block.subarray(0, take), offset);
                offset += take;
                counter++;
            }
            return stream;
        }

        function computeHmac(keyBytes, dataBytes, tagLen) {
            const blockSize = 64;
            let key = keyBytes;
            if (key.length > blockSize) key = sha256Sync(key);
            const paddedKey = new Uint8Array(blockSize);
            paddedKey.set(key, 0);

            const ipad = new Uint8Array(blockSize + dataBytes.length);
            const opad = new Uint8Array(blockSize + 32);
            for (let i = 0; i < blockSize; i++) {
                ipad[i] = paddedKey[i] ^ 0x36;
                opad[i] = paddedKey[i] ^ 0x5c;
            }
            ipad.set(dataBytes, blockSize);
            const inner = sha256Sync(ipad);
            opad.set(inner, blockSize);
            const full = sha256Sync(opad);
            return full.subarray(0, tagLen);
        }

        function constantTimeEqual(a, b) {
            if (a.length !== b.length) return false;
            let diff = 0;
            for (let i = 0; i < a.length; i++) diff |= (a[i] ^ b[i]);
            return diff === 0;
        }

        // ================= 模式常量 =================
        const MODE_SIMPLE = 1;
        const MODE_STANDARD = 2;
        const SALT_SIMPLE = 4;      // 简洁模式：4 字节盐（原 8）
        const SALT_STANDARD = 32;   // 标准模式：32 字节盐（原 16）
        const HMAC_SIMPLE = 4;      // 简洁模式：4 字节 HMAC（原 8）
        const HMAC_STANDARD = 16;   // 标准模式：16 字节 HMAC（原 8）

        // ================= 加密 =================
        function doEncrypt(text, password, mode) {
            const plainBytes = strToBytes(text);
            const pwdBytes = strToBytes(password);
            const isStandard = (mode === MODE_STANDARD);

            const saltLen = isStandard ? SALT_STANDARD : SALT_SIMPLE;
            const tagLen = isStandard ? HMAC_STANDARD : HMAC_SIMPLE;

            const salt = new Uint8Array(saltLen);
            crypto.getRandomValues(salt);

            const key = deriveKey(pwdBytes, salt);

            // 头部：1 字节随机前缀 + salt（首字节随机，避免密文首字符固定）
            const header = new Uint8Array(1 + saltLen);
            header[0] = crypto.getRandomValues(new Uint8Array(1))[0];
            header.set(salt, 1);

            const keystream = deriveKeystream(key, plainBytes.length);
            const cipherBody = new Uint8Array(plainBytes.length);
            for (let i = 0; i < plainBytes.length; i++) {
                cipherBody[i] = plainBytes[i] ^ keystream[i];
            }

            const hmacInput = new Uint8Array(header.length + cipherBody.length);
            hmacInput.set(header, 0);
            hmacInput.set(cipherBody, header.length);
            const tag = computeHmac(key, hmacInput, tagLen);

            const out = new Uint8Array(hmacInput.length + tag.length);
            out.set(hmacInput, 0);
            out.set(tag, hmacInput.length);

            if (isStandard) {
                // 标准模式：URL-safe Base64 去填充 + 字符集混淆置换
                return shuffleBase64(bytesToCleanBase64(out));
            } else {
                // 简洁模式：URL-safe Base64 去填充
                return bytesToCleanBase64(out);
            }
        }

        // ================= 解密 =================
        function doDecrypt(cipherText, password) {
            const pwdBytes = strToBytes(password);

            // 尝试用给定的 (saltLen, tagLen) 解析并校验
            const tryParse = (saltLen, tagLen, useShuffle) => {
                let str = cipherText;
                if (useShuffle) {
                    // 先尝试验证密文是否只含混淆字符集内的字符，否则跳过
                    for (const ch of str) {
                        if (!UNSHUFFLE_MAP[ch]) return null;
                    }
                    str = unshuffleBase64(str);
                }
                let raw;
                try {
                    raw = cleanBase64ToBytes(str);
                } catch (e) {
                    return null;
                }
                const headerLen = 1 + saltLen;
                if (raw.length < headerLen + tagLen) return null;

                const salt = raw.subarray(1, headerLen);
                const cipherBody = raw.subarray(headerLen, raw.length - tagLen);
                const receivedTag = raw.subarray(raw.length - tagLen);

                const key = deriveKey(pwdBytes, salt);
                const hmacInput = new Uint8Array(headerLen + cipherBody.length);
                hmacInput.set(raw.subarray(0, headerLen), 0);
                hmacInput.set(cipherBody, headerLen);
                const expectedTag = computeHmac(key, hmacInput, tagLen);

                if (!constantTimeEqual(receivedTag, expectedTag)) return null;

                const keystream = deriveKeystream(key, cipherBody.length);
                const plainBytes = new Uint8Array(cipherBody.length);
                for (let i = 0; i < cipherBody.length; i++) {
                    plainBytes[i] = cipherBody[i] ^ keystream[i];
                }
                try {
                    const text = bytesToStr(plainBytes);
                    if (text.length === 0 && plainBytes.length > 0) return null;
                    return text;
                } catch (e) {
                    return null;
                }
            };

            // 先尝试简洁模式（salt=4, tag=4, 无混淆）
            let result = tryParse(SALT_SIMPLE, HMAC_SIMPLE, false);
            if (result !== null) return result;

            // 再尝试标准模式（salt=32, tag=16, 有混淆）
            result = tryParse(SALT_STANDARD, HMAC_STANDARD, true);
            if (result !== null) return result;

            throw new Error('密码不正确');
        }

        // ================= 执行操作 =================
        function handleAction() {
            const text = document.getElementById('input-text').value.trim();
            const password = document.getElementById('password').value;

            if (!text) return showToast('请输入文本内容');
            if (!password) return showToast('请输入密码');

            const inputEl = document.getElementById('input-text');

            if (currentTab === 'encrypt') {
                try {
                    const mode = (currentMode === 'standard') ? MODE_STANDARD : MODE_SIMPLE;
                    const output = doEncrypt(text, password, mode);
                    inputEl.value = output;
                    showToast('加密成功');
                } catch (e) {
                    console.error(e);
                    showToast('加密失败：' + (e.message || '未知错误'));
                }
            } else {
                try {
                    const result = doDecrypt(text, password);
                    inputEl.value = result;
                    showToast('解密成功');
                } catch (e) {
                    console.error(e);
                    showToast('解密失败：密码错误或密文已损坏');
                }
            }
        }
    </script>
